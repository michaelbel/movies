name: Google Play

on:
  workflow_dispatch:

env:
  KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
  KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

concurrency:
  group: google-play-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Decode Keystore File
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/keystore_release.jks"
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build GmsRelease Bundle
        run: ./gradlew androidApp:bundleGmsRelease

      - name: Auth Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload Bundle to Google Play Production
        run: |
          set -euo pipefail

          PACKAGE_NAME="org.michaelbel.moviemade"
          TRACK="production"
          AAB_PATH="$(ls androidApp/build/outputs/bundle/gmsRelease/*.aab | head -n 1)"
          ACCESS_TOKEN="$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/androidpublisher)"

          google_play_request() {
            local response_file="$1"
            shift

            local http_status
            if ! http_status="$(curl -sS -w "%{http_code}" -o "$response_file" "$@")"; then
              echo "Google Play API request failed before receiving a successful response." >&2
              cat "$response_file" >&2
              exit 1
            fi

            if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
              echo "Google Play API request failed with HTTP ${http_status}" >&2
              cat "$response_file" >&2
              exit 1
            fi
          }

          EDIT_RESPONSE="$(mktemp)"
          google_play_request "$EDIT_RESPONSE" \
            -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits"

          EDIT_ID="$(jq -r '.id' "$EDIT_RESPONSE")"
          if [[ -z "$EDIT_ID" || "$EDIT_ID" == "null" ]]; then
            echo "Google Play API response does not contain edit id:" >&2
            cat "$EDIT_RESPONSE" >&2
            exit 1
          fi

          BUNDLE_RESPONSE="$(mktemp)"
          google_play_request "$BUNDLE_RESPONSE" \
            -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${AAB_PATH}" \
              "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${EDIT_ID}/bundles?uploadType=media"

          VERSION_CODE="$(jq -r '.versionCode' "$BUNDLE_RESPONSE")"
          if [[ -z "$VERSION_CODE" || "$VERSION_CODE" == "null" ]]; then
            echo "Google Play API response does not contain versionCode:" >&2
            cat "$BUNDLE_RESPONSE" >&2
            exit 1
          fi

          TRACK_RESPONSE="$(mktemp)"
          google_play_request "$TRACK_RESPONSE" \
            -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"releases\": [
                {
                  \"versionCodes\": [\"${VERSION_CODE}\"],
                  \"status\": \"completed\"
                }
              ]
            }" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${EDIT_ID}/tracks/${TRACK}"

          COMMIT_RESPONSE="$(mktemp)"
          google_play_request "$COMMIT_RESPONSE" \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${EDIT_ID}:commit"
